name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release --no-shrink --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/slip.apk

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slip-apk
          path: build/app/outputs/flutter-apk/slip.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: "Slip Release ${{ steps.get_tag.outputs.TAG_NAME }}"
          body: |
            ## Slip — Learn From Others' Exam Blunders
            
            ### Automated Open-Source Release
            - Built with Flutter 3.24.5 on Ubuntu Runner
            - Integrated with `slip-backend` Supabase (ap-south-1 Mumbai)
            - Features: Reddit-style post details, threaded comments with OP Author chip, native audio recording/playback, Google Tasks redesign with elevated FAB, delta sync & lazy loading, curved UI.
            
            **Direct Download:** `slip.apk`
          files: build/app/outputs/flutter-apk/slip.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
