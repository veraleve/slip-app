name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          DART_DEFINES=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          fi
          flutter build apk --release --no-shrink $DART_DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/slip.apk

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slip-apk
          path: build/app/outputs/flutter-apk/slip.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: "Slip Release ${{ steps.get_tag.outputs.TAG_NAME }}"
          body: |
            ## Slip — Ask doubts. Learn from mistakes. Master together.

            ### What's New in ${{ steps.get_tag.outputs.TAG_NAME }}:
            - **Feed Refresh & Topic Filter Fix**: Eliminated the 'For You' filter collision that purged posts on manual refresh; guaranteed peer and personal posts remain persistent.
            - **Persistent Comments & Cloud Synchronization**: Threaded comments and answers now persist locally and synchronize reliably to Supabase with validated UUID author signatures.
            - **Solution Marking in Discussions**: Doubt authors can now mark helpful peer comments as the 'Accepted Solution', automatically resolving the doubt.
            - **Persistent Cleared/Mastered Status**: Retained blunder inoculation mastery across app updates, offline restarts, and remote sync.
            - **1-Time Community Standards & Privacy Agreement**: Integrated a professional one-time agreement on sign-up enforcing zero-harassment and data privacy, stored in the cloud database.
            - **Broadcast Notifications Engine**: Real-time policy update and community notice announcements in the notification center.
            - **UI Refinements**: Removed redundant header refresh icon in favor of smooth pull-to-refresh; polished tactile button animations.

            **Direct Download:** `slip.apk`
          files: build/app/outputs/flutter-apk/slip.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
