name: Pull Request CI

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Flutter Lint & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting & Analysis
        run: flutter analyze

      - name: Execute Automated Unit & Widget Tests
        run: flutter test
