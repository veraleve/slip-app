name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release --no-shrink --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/slip.apk

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slip-apk
          path: build/app/outputs/flutter-apk/slip.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: "Slip Release ${{ steps.get_tag.outputs.TAG_NAME }}"
          body: |
            ## Slip — Ask doubts. Learn from mistakes. Master together.

            ### What's New in ${{ steps.get_tag.outputs.TAG_NAME }}:
            - **MIT Open-Source License**: Official open-source release with standard MIT licensing and updated contribution guides.
            - **Security & Injection Lockdown**: Defeated PostgREST wildcard injection and null-account takeover in authentication and password reset; secured local desktop HTTP bridge with cryptographic token entropy and removed fallback bypasses.
            - **Multi-Account Storage Isolation**: Completely scoped bookmarks, deletion filters, cached drafts, and custom revision task lists per user handle.
            - **Native Android Hardware Bridge Fixes**: Fixed camera and microphone permission request delegation to prevent UI freezes, and switched remote audio playback to asynchronous preparation to avoid ANR crashes.
            - **Data Integrity & Multi-Image Attachments**: Preserved all multi-image attachments locally and in cloud storage; preserved General Doubt tagging across cache deserialization.
            - **Peer Access Control**: Protected peer blunder posts from unauthorized deletion or editing in profile views.
            - **Swiss Design Polish**: Converted all boxy container and badge radii to Swiss curved pill standards (6-16px) and purged emoji artifacts from web server templates.

            **Direct Download:** `slip.apk`
          files: build/app/outputs/flutter-apk/slip.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
