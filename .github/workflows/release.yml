name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release --no-shrink --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/slip.apk

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slip-apk
          path: build/app/outputs/flutter-apk/slip.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: "Slip Release ${{ steps.get_tag.outputs.TAG_NAME }}"
          body: |
            ## Slip — Ask doubts. Learn from mistakes. Master together.

            ### What's New in v0.1.9:
            - Permanent Release Keystore: Integrated permanent cryptographic signing key into the build pipeline. All future in-app updates will install seamlessly in-place just like the Google Play Store with zero package signature conflicts and zero data loss.
            - Desktop Connect Web Bridge: Built-in local HTTP server (port 8080) to connect your laptop over Wi-Fi/Hotspot. Log test blunders and paste question screenshots with Ctrl+V with zero cloud fees.
            - In-Text Clickable Links: Auto-detects http:// and https:// URLs across doubts, blunders, and comments, opening them natively in your browser.
            - General Doubt Quick Chip: Ask doubts without mandatory syllabus subject tagging; simplifies doubt input form.
            - Auto-Login & Session Persistence: Fixed app reopen prompt—sessions now persist reliably through device reboots and restarts.
            - Settings Exam Papers Persistence: Target exam papers selection in Settings now saves immediately to local preferences.
            - Post 3-Dot Overflow Menu: Replaced separate edit/delete icons with a clean 3-dot dropdown popup menu.
            - Feed My Mistakes Tab Fix: Fixed mistake visibility filtering so local blunders remain visible across app restarts.
            - Polished Google Tasks Layout: Removed boxed card layout, seamless canvas rendering, and optimized floating action button positioning.

            **Direct Download:** `slip.apk`
          files: build/app/outputs/flutter-apk/slip.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
