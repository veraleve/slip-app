name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release --no-shrink --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/slip.apk

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slip-apk
          path: build/app/outputs/flutter-apk/slip.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: "Slip Release ${{ steps.get_tag.outputs.TAG_NAME }}"
          body: |
            ## Slip — Ask doubts. Learn from mistakes. Master together.

            ### What's New in ${{ steps.get_tag.outputs.TAG_NAME }}:
            - **Reaction Micro-Animations & Haptics**: Scale-burst bounce on Solved checkmark, pop scale + floating overlay pill (`+1 Same doubt!`) on Same Doubt/Mistake, and Instagram-style pop animation on Save/Bookmark.
            - **Same Doubt & Reaction Sync**: Same Doubt counters and user reactions sync to Supabase `slips` table and persist across app restarts and refreshes.
            - **Discussion Threads & Comment Counters**: Visible comment count badges on feed cards and reactive comment counters in Post Detail discussions.
            - **Password-Protected Desktop Bridge**: Embedded phone handle with account password verification for the local Wi-Fi Desktop Connect server.
            - **Multi-Account User Data Isolation**: Scoped local blunders and mock test reminders per user handle so switching accounts never leaks private data; added password reset support.
            - **Streamlined General Tagging**: Clean `[GENERAL]` badge for general doubts without subject clutter.
            - **Permanent Release Keystore**: All updates install in-place seamlessly with zero data loss.

            **Direct Download:** `slip.apk`
          files: build/app/outputs/flutter-apk/slip.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
