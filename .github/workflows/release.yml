name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build_release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          DART_DEFINES=""
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            DART_DEFINES="$DART_DEFINES --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          fi
          flutter build apk --release --no-shrink $DART_DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/slip.apk

      - name: Determine Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slip-apk
          path: build/app/outputs/flutter-apk/slip.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: "Slip Release ${{ steps.get_tag.outputs.TAG_NAME }}"
          body: |
            ## Slip — Ask doubts. Learn from mistakes. Master together.

            ### What's New in ${{ steps.get_tag.outputs.TAG_NAME }}:
            - **Modular Desktop Workspace Architecture**: Refactored Desktop Bridge into dedicated modular components (Auth, Feed, Comments, Tasks, Web UI) for superior maintainability and performance.
            - **Expanded Desktop Portal**: Full-featured laptop experience with live Peer Feed browsing, search filter, answer submission, accepted solution marking, and study revision task management.
            - **GATE Paper Cloud & DB Synchronization**: Multi-exam target selection (CS, DA, EC, ME) now persists dynamically to user profiles in the database and synchronizes peer doubts instantaneously.
            - **Feed Refresh Retention**: Resolved exam filter collisions and duplicate scope declarations; guaranteed authored doubts and blunders remain permanent on refresh.
            - **Production Secret Fallback**: Robust runtime getters ensure continuous cloud connectivity across offline and online environments.

            **Direct Download:** `slip.apk`
          files: build/app/outputs/flutter-apk/slip.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
