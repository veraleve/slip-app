name: slip
description: "Slip — Open-source peer learning platform where students learn from each other's exam blunders."
publish_to: 'none'

version: 0.1.2+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Pure Dart Supabase SDK (ultra-fast, zero Gradle plugin conflicts)
  supabase: ^2.5.0
  shared_preferences: ^2.2.3
  # Google Tasks Typography
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
